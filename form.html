<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style_prueba.css">
</head>
    
<body>
       <form>

            <div class="formulario">
            <legend>
                <h1>formulario de reserva</h1>
            </legend>
            <div class="name">
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="" placeholder="Nombre(s) y apellidos" required ; style="width: 100%;"; color: white; border-radius: 5px; padding: 5px; border: 0px solid #ccc;">
                <br>
                <br>
            </p>
            </div>
            <div class="mail">
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Ingrese su correo electronico" required; style="width: 100%;"; color: white; border-radius: 5px; padding: 5px; border: 0px solid #ccc;">
                 <br>
                <br>

            </p>
            </div>
            <div class="telefono">
            <p>
                <Label for="telefono"> telefono:</Label>
                <input type="tel" id="telefono" name="telefono" placeholder="3138909102 por ejemplo" required ; style="width: 100%;"; color: white; border-radius: 5px; padding: 5px; border: 0px solid #ccc;">
                <br>
                <br>
            </p>
            </div>
            <div class="documento">
            <p>
                <label for="documento"> documento:</label>
                <input type="number" id="documento" name="documento" placeholder="C.C, T.I" required ; style="width: 100%;"; color: white; border-radius:10px; padding:10px; border:10px solid #ccc;">
                <br>
                <br>
            </p>
            </div>
            <div class="comentario" style="width: 100%;color: white;">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" name="comentario" placeholder="Ingrese su comentario" class="comentario"></textarea>
                <br>
                <br>
            </div>
            <br>
            <br>
            <br>
            <div style="text-align: center; color: white; width: 100%;">   
                <button type="submit" class="btn btn-primary", style="background-color: hwb(224 13% 25% / 0.877); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                    enviar
                </button>
            </div>
            
    </form>

</body>
</html>
